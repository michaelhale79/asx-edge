name: ASX Edge Global Trends UI

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/patch-global-ui.py'
      - '.github/workflows/global-ui.yml'

permissions:
  contents: write

jobs:
  patch-global-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch global trend UI
        run: python scripts/patch-global-ui.py
      - name: Commit global trend UI
        run: |
          git config user.name "ASX Edge Bot"
          git config user.email "asx-edge@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Show global trends in ASX Edge"
          git push
