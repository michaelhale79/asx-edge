name: ASX Edge Daily Scan

on:
  workflow_dispatch:
  schedule:
    - cron: "15 7 * * 1-5"

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run ASX scanner
        shell: python
        run: |
          import json, statistics, urllib.request, datetime
          from pathlib import Path

          VERSION = 2

          TICKERS = [
            "BHP","CBA","CSL","NAB","WBC","ANZ","WES","MQG","GMG","RIO",
            "TLS","WOW","TCL","FMG","ALL","REA","XRO","WDS","QBE","RMD",
            "MIN","JHX","CAR","SEK","CPU","ALD","STO","COL","S32","ORG",
            "SUN","IAG","BXB","AMC","SHL","ASX","APA","MPL","TWE","NXT",
            "WBT","BRN","LYC","PLS","LTR","ZIP","PME","MP1","DMP","NEC"
          ]

          H = {"User-Agent":"Mozilla/5.0"}

          def clamp(x):
              return max(0,min(100,x))

          def pct(a,b):
              return ((a/b)-1)*100 if b else 0

          def fetch(symbol):
              url = "https://query1.finance.yahoo.com/v8/finance/chart/" + symbol + "?range=1y&interval=1d"
              req = urllib.request.Request(url,headers=H)
              with urllib.request.urlopen(req,timeout=20) as r:
                  raw = json.load(r)

              x = raw["chart"]["result"][0]
              p = x["indicators"]["adjclose"][0]["adjclose"]
              v = x["indicators"]["quote"][0]["volume"]

              rows = [(a,b or 0) for a,b in zip(p,v) if a is not None]

              if len(rows) < 80:
                  raise Exception("Not enough history")

              return rows

          def ret(prices,days):
              i = max(0,len(prices)-1-days)
              return pct(prices[-1],prices[i])

          def avg(values,n):
              x = values[-min(n,len(values)):]
              return sum(x)/len(x)

          def drawdown(prices,n=60):
              block = prices[-min(n,len(prices)):]
              peak = block[0]
              worst = 0

              for p in block:
                  peak = max(peak,p)
                  worst = min(worst,pct(p,peak))

              return abs(worst)

          benchRows = fetch("^AXJO")
          bp = [x[0] for x in benchRows]

          bench = {
              20:ret(bp,20),
              60:ret(bp,60),
              120:ret(bp,120)
          }

          def analyse(ticker,rows):

              prices = [x[0] for x in rows]
              volumes = [x[1] for x in rows]

              price = prices[-1]

              r5 = ret(prices,5)
              r20 = ret(prices,20)
              r60 = ret(prices,60)
              r120 = ret(prices,120)
              r250 = ret(prices,250)

              rs20 = r20-bench[20]
              rs60 = r60-bench[60]
              rs120 = r120-bench[120]

              ma20 = avg(prices,20)
              ma60 = avg(prices,60)
              ma200 = avg(prices,200)

              daily = [
                  pct(prices[i],prices[i-1])
                  for i in range(max(1,len(prices)-60),len(prices))
              ]

              vol = statistics.pstdev(daily)
              dd = drawdown(prices)

              vol20 = avg(volumes,20)
              vol60 = avg(volumes,60)

              volumeRatio = volumes[-1]/vol20 if vol20 else 1
              volumeTrend = vol20/vol60 if vol60 else 1

              above20 = sum(
                  1 for p in prices[-20:]
                  if p > ma20
              ) / min(20,len(prices))

              trendStack = (
                  int(price > ma20)
                  + int(ma20 > ma60)
                  + int(ma60 > ma200)
              )

              relative = clamp(
                  50
                  + rs20
                  + rs60*.45
                  + rs120*.20
              )

              persistence = clamp(
                  25
                  + above20*45
                  + trendStack*10
              )

              acceleration = (
                  rs20-rs60/3
                  + .35*(r5-r20/4)
              )

              inflecting = clamp(
                  50
                  + acceleration*1.15
                  + (8 if ma20 > ma60 else -8)
                  + (6 if volumeTrend > 1.08 else 0)
              )

              stability = clamp(
                  85
                  - vol*8
                  - dd*1.15
              )

              volumeScore = clamp(
                  50
                  + (volumeRatio-1)*18
                  + (volumeTrend-1)*30
              )

              penalty = 0

              if r20 > 25:
                  penalty += min(16,(r20-25)*.6)

              if r5 > 15:
                  penalty += min(12,(r5-15)*.8)

              if price > ma20*1.18:
                  penalty += 8

              risk = clamp(
                  18
                  + vol*7
                  + dd*.9
                  + penalty
              )

              catalyst = clamp(
                  45
                  + (volumeScore-50)*.55
                  + max(0,acceleration)*.6
              )

              early = clamp(
                  inflecting*.45
                  + relative*.25
                  + volumeScore*.20
                  + (100-persistence)*.10
              )

              opportunity = clamp(
                  relative*.28
                  + inflecting*.27
                  + persistence*.18
                  + stability*.15
                  + volumeScore*.12
                  - penalty
              )

              edge = (
                  "UNDER-NOTICED"
                  if early > opportunity+4
                  else "INFLECTING"
              )

              return {
                "ticker":ticker,
                "name":ticker,
                "price":round(price,3),

                "opp":round(opportunity),
                "edge":edge,

                "quality":round(stability),
                "valuation":50,
                "growth":round(inflecting),
                "momentum":round(relative),
                "catalystScore":round(catalyst),
                "risk":round(risk),

                "delta":0,

                "return1m":round(r20,1),
                "return3m":round(r60,1),
                "return6m":round(r120,1),
                "return12m":round(r250,1),

                "relative1m":round(rs20,1),
                "relative3m":round(rs60,1),
                "relative6m":round(rs120,1),

                "volumeRatio":round(volumeRatio,2),
                "drawdown60":round(dd,1),

                "thesis":
                  f"Relative strength vs ASX 200: {rs20:+.1f}% over 1 month and {rs60:+.1f}% over 3 months. Trend persistence {round(persistence)}/100.",

                "catalyst":
                  f"20-day volume trend is {volumeTrend:.2f}× the 60-day average. " +
                  (
                    "Relative strength is accelerating."
                    if acceleration > 2
                    else "Relative strength is not yet accelerating strongly."
                  ),

                "riskText":
                  f"60-day volatility {vol:.1f}% per day; recent max drawdown {dd:.1f}%. " +
                  (
                    "The stock is being penalised for overextension."
                    if penalty > 0
                    else "No major overextension penalty."
                  ),

                "history":[]
              }

          path = Path("data.json")
          previous = {}
          oldVersion = None

          if path.exists():
              try:
                  old = json.loads(path.read_text())
                  oldVersion = old.get("engineVersion")
                  previous = {
                      x["ticker"]:x
                      for x in old.get("stocks",[])
                  }
              except:
                  pass

          stocks = []

          for ticker in TICKERS:

              try:

                  print("Scanning",ticker)

                  item = analyse(
                      ticker,
                      fetch(ticker+".AX")
                  )

                  if ticker in previous and oldVersion == VERSION:

                      oldScore = previous[ticker].get(
                          "opp",
                          item["opp"]
                      )

                      item["delta"] = (
                          item["opp"]-oldScore
                      )

                      item["history"] = previous[ticker].get(
                          "history",
                          []
                      )[-9:]

                      if item["delta"] != 0:

                          item["history"].append([
                              datetime.date.today().isoformat(),
                              "Opportunity score changed",
                              f"{oldScore} → {item['opp']}"
                          ])

                  stocks.append(item)

              except Exception as e:

                  print(
                      "FAILED",
                      ticker,
                      e
                  )

          stocks.sort(
              key=lambda x:x["opp"],
              reverse=True
          )

          output = {
              "engineVersion":VERSION,
              "updated":datetime.datetime.now(
                  datetime.timezone.utc
              ).isoformat(),
              "source":"Free daily market data",
              "benchmark":"ASX 200",
              "stocks":stocks
          }

          path.write_text(
              json.dumps(
                  output,
                  indent=2
              )
          )

      - name: Commit updated data
        run: |
          git config user.name "ASX Edge Bot"
          git config user.email "asx-edge@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "Update ASX Edge market data"
          git push
