name: Apply ASX Edge UI Security Patch

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/scripts/patch_ui.py'
      - '.github/workflows/ui-security-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch app
        run: python .github/scripts/patch_ui.py
      - name: Commit app
        run: |
          git config user.name "ASX Edge Bot"
          git config user.email "asx-edge@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Add portfolio tabs and hashed PIN lock"
          git push
