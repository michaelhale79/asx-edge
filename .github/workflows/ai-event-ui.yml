name: ASX Edge AI Event UI

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/patch-ai-event-ui.py'
      - '.github/workflows/ai-event-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply AI event UI
        run: python scripts/patch-ai-event-ui.py
      - name: Verify UI integration
        run: |
          python - <<'PY'
          s=open('index.html').read()
          for x in ['AI event opportunities','detailAIEvents','aiEventAdjustment','function aiEventHtml','AI EVENT']:
              assert x in s, x
          print('AI event UI verified')
          PY
      - name: Commit app update
        run: |
          git config user.name "ASX Edge Bot"
          git config user.email "asx-edge@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Show AI event reasoning in ASX Edge"
          git pull --rebase origin main
          git push
