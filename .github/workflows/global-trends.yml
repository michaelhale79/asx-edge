name: ASX Edge Global Trends

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/global-trends.yml'
  schedule:
    - cron: "50 7 * * 1-5"

permissions:
  contents: write

jobs:
  enrich-global-trends:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Apply global-news trend layer
        shell: python
        run: |
          import datetime
          import html
          import json
          import math
          import re
          import urllib.parse
          import urllib.request
          import xml.etree.ElementTree as ET
          from pathlib import Path

          DATA_PATH = Path("data.json")
          if not DATA_PATH.exists():
              raise SystemExit("data.json not found")

          data = json.loads(DATA_PATH.read_text())
          stocks = data.get("stocks", [])

          THEMES = {
              "AI / DATA CENTRES": {
                  "query": '(AI OR artificial intelligence OR data centre OR data center OR semiconductors OR cloud infrastructure) when:3d',
                  "positive": ["surge","boom","record","investment","spending","demand","growth","expand","expansion","upgrade","strong","accelerate","capacity","orders"],
                  "negative": ["slowdown","cuts","cutback","delay","weak","slump","oversupply","cancel","cancellation","shortage of power","restriction"],
              },
              "DEFENCE": {
                  "query": '(defence spending OR defense spending OR drones OR missiles OR hypersonic OR military technology) when:5d',
                  "positive": ["spending","rearm","orders","contract","funding","investment","demand","expand","production","partnership","procurement"],
                  "negative": ["ceasefire","cuts","cut spending","cancel","delay","reduction","budget cut"],
              },
              "GOLD": {
                  "query": '(gold price OR central bank gold OR safe haven gold) when:3d',
                  "positive": ["record","rally","surge","safe haven","buying","demand","higher","rise","rises","up"],
                  "negative": ["falls","fall","slump","selloff","lower","drop","drops","weaker"],
              },
              "OIL / ENERGY": {
                  "query": '(oil price OR crude oil OR LNG OR natural gas supply) when:3d',
                  "positive": ["surge","higher","rise","rises","supply disruption","sanctions","shortage","tight supply","demand","outage"],
                  "negative": ["falls","fall","lower","glut","oversupply","weak demand","ceasefire","reopens","surplus"],
              },
              "URANIUM": {
                  "query": '(uranium price OR nuclear power uranium OR uranium supply) when:7d',
                  "positive": ["reactor","nuclear expansion","demand","supply deficit","shortage","contract","restart","investment","higher","rally"],
                  "negative": ["shutdown","delay","oversupply","lower","weak","suspension"],
              },
              "COPPER": {
                  "query": '(copper price OR copper demand OR copper supply OR electrification copper) when:5d',
                  "positive": ["record","rally","demand","deficit","shortage","investment","grid","electrification","higher","rise"],
                  "negative": ["surplus","weak demand","slump","lower","fall","falls","oversupply"],
              },
              "LITHIUM": {
                  "query": '(lithium price OR lithium demand OR battery metals OR EV battery demand) when:5d',
                  "positive": ["recovery","rally","demand","higher","shortage","curtailment","cut supply","battery demand","rise"],
                  "negative": ["oversupply","glut","weak demand","lower","slump","fall","falls","inventory"],
              },
              "CHINA / IRON ORE": {
                  "query": '(China steel demand OR China property stimulus OR iron ore price OR Chinese construction) when:5d',
                  "positive": ["stimulus","support","recovery","higher","demand","infrastructure","construction growth","rise","rally"],
                  "negative": ["weak steel","property slump","slowdown","lower","fall","falls","steel cuts","weak demand","oversupply"],
              },
              "RARE EARTHS": {
                  "query": '(rare earths supply OR critical minerals policy OR rare earth prices) when:7d',
                  "positive": ["funding","investment","supply security","restriction","export controls","demand","critical minerals","strategic"],
                  "negative": ["oversupply","lower","weak demand","delay","cuts"],
              },
              "RATE EASING": {
                  "query": '(central bank rate cuts OR inflation easing OR bond yields falling OR interest rate cuts) when:3d',
                  "positive": ["rate cut","rate cuts","easing","inflation falls","inflation easing","yields fall","lower rates","dovish"],
                  "negative": ["rate hike","rate hikes","hawkish","higher yields","inflation rises","tightening"],
              },
          }

          EXPOSURES = {
              "WBT": {"AI / DATA CENTRES": 1.0},
              "NXT": {"AI / DATA CENTRES": 1.0, "RATE EASING": 0.45},
              "MP1": {"AI / DATA CENTRES": 0.75, "RATE EASING": 0.25},
              "DTL": {"AI / DATA CENTRES": 0.65},
              "DRO": {"DEFENCE": 1.0, "AI / DATA CENTRES": 0.20},
              "EOS": {"DEFENCE": 1.0},
              "ASB": {"DEFENCE": 0.85},
              "GOLD": {"GOLD": 1.0},
              "NST": {"GOLD": 1.0},
              "EVN": {"GOLD": 1.0},
              "NEM": {"GOLD": 1.0},
              "WDS": {"OIL / ENERGY": 1.0},
              "STO": {"OIL / ENERGY": 1.0},
              "KAR": {"OIL / ENERGY": 0.85},
              "BPT": {"OIL / ENERGY": 0.80},
              "ORG": {"OIL / ENERGY": 0.40},
              "PDN": {"URANIUM": 1.0},
              "BOE": {"URANIUM": 1.0},
              "DYL": {"URANIUM": 1.0},
              "SFR": {"COPPER": 1.0},
              "29M": {"COPPER": 1.0},
              "BHP": {"COPPER": 0.60, "CHINA / IRON ORE": 0.70},
              "RIO": {"COPPER": 0.40, "CHINA / IRON ORE": 0.85},
              "S32": {"COPPER": 0.40},
              "PLS": {"LITHIUM": 1.0},
              "LTR": {"LITHIUM": 1.0},
              "MIN": {"LITHIUM": 0.75, "CHINA / IRON ORE": 0.55},
              "IGO": {"LITHIUM": 0.70},
              "FMG": {"CHINA / IRON ORE": 1.0},
              "LYC": {"RARE EARTHS": 1.0},
              "ILU": {"RARE EARTHS": 0.65},
              "REA": {"RATE EASING": 0.35},
              "XRO": {"RATE EASING": 0.30},
              "CAR": {"RATE EASING": 0.20},
          }

          TRUSTED = [
              "Reuters", "Bloomberg", "Financial Times", "CNBC", "BBC", "Associated Press",
              "The Guardian", "S&P Global", "Nikkei Asia", "The Australian Financial Review"
          ]

          headers = {"User-Agent": "Mozilla/5.0 (compatible; ASXEdge/1.0)"}

          def fetch_rss(query):
              url = (
                  "https://news.google.com/rss/search?q="
                  + urllib.parse.quote(query)
                  + "&hl=en-AU&gl=AU&ceid=AU:en"
              )
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as r:
                  return r.read()

          def score_text(text, positives, negatives):
              t = text.lower()
              score = 0
              for phrase in positives:
                  if phrase in t:
                      score += 1
              for phrase in negatives:
                  if phrase in t:
                      score -= 1
              return score

          def parse_theme(name, config):
              try:
                  raw = fetch_rss(config["query"])
                  root = ET.fromstring(raw)
                  rows = []
                  weighted_total = 0.0
                  total_weight = 0.0
                  for item in root.findall(".//item")[:30]:
                      title = html.unescape(item.findtext("title") or "").strip()
                      source = item.findtext("source") or ""
                      if not title:
                          continue
                      weight = 1.0 if any(x.lower() in source.lower() for x in TRUSTED) else 0.55
                      raw_score = score_text(title, config["positive"], config["negative"])
                      weighted_total += raw_score * weight
                      total_weight += weight
                      rows.append({"title": title[:180], "source": source[:80], "signal": raw_score})

                  if total_weight == 0:
                      return {"name": name, "score": 0, "direction": "NEUTRAL", "headlines": []}

                  average = weighted_total / total_weight
                  volume_boost = min(1.35, 0.65 + len(rows) / 35)
                  score = max(-100, min(100, round(average * 38 * volume_boost)))
                  direction = "STRONG POSITIVE" if score >= 35 else "POSITIVE" if score >= 12 else "STRONG NEGATIVE" if score <= -35 else "NEGATIVE" if score <= -12 else "NEUTRAL"
                  ranked = sorted(rows, key=lambda x: abs(x["signal"]), reverse=True)[:5]
                  return {"name": name, "score": score, "direction": direction, "headlines": ranked}
              except Exception as e:
                  print("Theme failed", name, e)
                  return {"name": name, "score": 0, "direction": "UNAVAILABLE", "headlines": []}

          theme_results = {name: parse_theme(name, cfg) for name, cfg in THEMES.items()}

          for name, result in theme_results.items():
              print(name, result["score"], result["direction"])

          for stock in stocks:
              ticker = str(stock.get("ticker", "")).upper()
              exposure = EXPOSURES.get(ticker, {})
              stock["globalThemes"] = []
              if not exposure:
                  stock["globalTrendScore"] = 0
                  stock["globalTrendAdjustment"] = 0
                  stock["globalTrendSignal"] = "NEUTRAL"
                  stock["oppPreTrend"] = stock.get("oppPreTrend", stock.get("opp", 0))
                  continue

              weighted = 0.0
              weight_total = 0.0
              theme_cards = []
              for theme_name, weight in exposure.items():
                  result = theme_results.get(theme_name, {"score": 0, "direction": "UNAVAILABLE", "headlines": []})
                  weighted += result["score"] * weight
                  weight_total += abs(weight)
                  theme_cards.append({
                      "theme": theme_name,
                      "score": result["score"],
                      "direction": result["direction"],
                      "weight": weight,
                      "headlines": result["headlines"][:3],
                  })

              trend_score = round(weighted / weight_total) if weight_total else 0
              adjustment = round(max(-8, min(8, trend_score * 0.08)))
              base = stock.get("oppPreTrend", stock.get("opp", 0))
              try:
                  base = float(base)
              except Exception:
                  base = 0

              stock["oppPreTrend"] = round(base)
              stock["globalTrendScore"] = trend_score
              stock["globalTrendAdjustment"] = adjustment
              stock["globalTrendSignal"] = "BULLISH" if trend_score >= 12 else "BEARISH" if trend_score <= -12 else "NEUTRAL"
              stock["globalThemes"] = sorted(theme_cards, key=lambda x: abs(x["score"] * x["weight"]), reverse=True)
              stock["opp"] = round(max(0, min(100, base + adjustment)))

          data["globalTrendUpdated"] = datetime.datetime.now(datetime.timezone.utc).isoformat()
          data["globalTrendSource"] = "Google News RSS world-news headlines, weighted toward major news sources"
          data["globalTrendThemes"] = list(theme_results.values())
          data["stocks"] = stocks
          DATA_PATH.write_text(json.dumps(data, indent=2))

      - name: Commit global-trend enrichment
        run: |
          git config user.name "ASX Edge Bot"
          git config user.email "asx-edge@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "Update global trends for ASX opportunities"
          git push
