name: Refine Structured Thesis Quality

on:
  push:
    paths:
      - 'scripts/refine_thesis_quality.py'
      - '.github/workflows/refine-thesis-quality.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refine thesis quality
        run: python scripts/refine_thesis_quality.py
      - name: Verify refinement
        run: |
          grep -q 'Advance the clinical pipeline' scripts/decision_intelligence.py
          grep -q 'milestones=catalysts' scripts/decision_intelligence.py
      - name: Commit refinement
        run: |
          git config user.name "ASX Edge Bot"
          git config user.email "asx-edge@users.noreply.github.com"
          git add scripts/decision_intelligence.py
          git diff --cached --quiet || git commit -m "Improve structured thesis quality"
          git push
