name: Integrate Fundamentals Into ASX Edge

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/integrate_fundamentals.py'
      - '.github/workflows/integrate-fundamentals.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Integrate fundamentals into scoring and UI
        run: python scripts/integrate_fundamentals.py
      - name: Commit integration
        run: |
          git config user.name "ASX Edge Bot"
          git config user.email "asx-edge@users.noreply.github.com"
          git add scripts/deep_research.py index.html
          git diff --cached --quiet || git commit -m "Use fundamentals in stock decisions"
          git pull --rebase origin main
          git push
