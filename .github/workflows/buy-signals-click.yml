name: Add clickable BUY signals list

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/buy-signals-click.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch BUY signals metric
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          s=s.replace('.metric{padding:11px}', '.metric{padding:11px}.metric.clickable{cursor:pointer}.metric.clickable:active{transform:scale(.98);border-color:#2f9f5b}')

          old='<div class="metric"><div class="metric-value" id="buyCount">—</div><div class="metric-label">BUY signals</div></div>'
          new='<div class="metric clickable" id="buyMetric"><div class="metric-value" id="buyCount">—</div><div class="metric-label">BUY signals · tap to view</div></div>'
          if old not in s:
              raise SystemExit('BUY metric markup not found')
          s=s.replace(old,new,1)

          s=s.replace('let stocks=[],edgeFilter="ALL",previousPage="home",editingHolding=null;', 'let stocks=[],edgeFilter="ALL",signalFilter="ALL",previousPage="home",editingHolding=null;',1)

          old_filter='const q=$("#search").value.trim().toLowerCase(),r=stocks.filter(s=>(edgeFilter==="ALL"||s.edge===edgeFilter)&&(!q||s.ticker.toLowerCase().includes(q)||String(s.name||"").toLowerCase().includes(q)||String(s.sector||"").toLowerCase().includes(q)||String(s.industry||"").toLowerCase().includes(q)))'
          new_filter='const q=$("#search").value.trim().toLowerCase(),r=stocks.filter(s=>(edgeFilter==="ALL"||s.edge===edgeFilter)&&(signalFilter==="ALL"||recommendation(s).label===signalFilter)&&(!q||s.ticker.toLowerCase().includes(q)||String(s.name||"").toLowerCase().includes(q)||String(s.sector||"").toLowerCase().includes(q)||String(s.industry||"").toLowerCase().includes(q)))'
          if old_filter in s:
              s=s.replace(old_filter,new_filter,1)
          else:
              # fallback for earlier search function without sector/industry
              s=re.sub(r'const q=\$\("#search"\)\.value\.trim\(\)\.toLowerCase\(\),r=stocks\.filter\(s=>\(edgeFilter==="ALL"\|\|s\.edge===edgeFilter\)\&\&', 'const q=$("#search").value.trim().toLowerCase(),r=stocks.filter(s=>(edgeFilter==="ALL"||s.edge===edgeFilter)&&(signalFilter==="ALL"||recommendation(s).label===signalFilter)&&', s, count=1)

          hook='$("#buyMetric").onclick=()=>{signalFilter="BUY";edgeFilter="ALL";$("#search").value="";$$('.encode() if False else ''
          marker='$("#search").oninput=renderDiscover;'
          add='$("#buyMetric").onclick=()=>{signalFilter="BUY";edgeFilter="ALL";$("#search").value="";$$\'.edge\'.forEach(b=>b.classList.toggle("active",b.dataset.edge==="ALL"));showPage("discover");renderDiscover()};'
          # build safely without awkward Python quoting
          add = '$("#buyMetric").onclick=()=>{signalFilter="BUY";edgeFilter="ALL";$("#search").value="";$$(' + '".edge"' + ').forEach(b=>b.classList.toggle("active",b.dataset.edge==="ALL"));showPage("discover");renderDiscover()};'
          if marker not in s:
              raise SystemExit('Search binding marker not found')
          s=s.replace(marker,add+marker,1)

          # Selecting a normal Discover segment clears the BUY-only filter.
          seg='edgeFilter=b.dataset.edge;'
          if seg in s:
              s=s.replace(seg,'signalFilter="ALL";edgeFilter=b.dataset.edge;',1)

          p.write_text(s,encoding='utf-8')

          checks=['id="buyMetric"','signalFilter="BUY"','recommendation(s).label===signalFilter','BUY signals · tap to view']
          for c in checks:
              if c not in s: raise SystemExit(f'Missing expected patch: {c}')
      - name: Commit update
        run: |
          git config user.name "ASX Edge Bot"
          git config user.email "asx-edge@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Make BUY signals count open filtered list"
          git push
