name: ASX Edge Compact Holdings UI

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/patch-compact-holdings.py'
      - '.github/workflows/compact-holdings-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply compact holdings UI
        run: python scripts/patch-compact-holdings.py
      - name: Verify compact holdings
        run: |
          python - <<'PY'
          s=open('index.html').read()
          for x in ['/* Compact holdings cards */','holding-summary','holding-stat','Why ${r.label}?','data-holdingwhy','holding-review']:
              assert x in s, x
          assert '.holding-card .trade-banner{display:none!important}' in s
          print('compact holdings verified')
          PY
      - name: Commit app update
        run: |
          git config user.name "ASX Edge Bot"
          git config user.email "asx-edge@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Compress ASX Edge holdings cards"
          git pull --rebase origin main
          git push
