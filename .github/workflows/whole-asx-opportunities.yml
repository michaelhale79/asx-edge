name: ASX Edge Whole ASX Opportunities

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/whole_asx_opportunities.py'
      - '.github/workflows/whole-asx-opportunities.yml'
  schedule:
    - cron: "35 7 * * 1-5"

permissions:
  contents: write

concurrency:
  group: asx-edge-data
  cancel-in-progress: false

jobs:
  whole-asx-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan entire ASX for opportunities
        run: python scripts/whole_asx_opportunities.py

      - name: Commit whole-ASX discoveries
        run: |
          git config user.name "ASX Edge Bot"
          git config user.email "asx-edge@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "Update whole ASX opportunities"
          git pull --rebase origin main
          git push
