name: Refine Management History

on:
  push:
    paths:
      - 'scripts/refine_management_history.py'
      - '.github/workflows/refine-management-history.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refine management promise tracking
        run: python scripts/refine_management_history.py
      - name: Verify refinement
        run: |
          grep -q 'resolutionDocumentDate' scripts/decision_intelligence.py
          grep -q 'same-run resolutions' scripts/decision_intelligence.py
      - name: Commit refinement
        run: |
          git config user.name "ASX Edge Bot"
          git config user.email "asx-edge@users.noreply.github.com"
          git add scripts/decision_intelligence.py
          git diff --cached --quiet || git commit -m "Require later evidence to resolve management commitments"
          git push
