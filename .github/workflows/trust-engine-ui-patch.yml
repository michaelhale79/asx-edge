name: ASX Edge Trust Engine UI

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/patch-trust-engine-ui.py'
      - '.github/workflows/trust-engine-ui-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch trust engine UI
        run: python scripts/patch-trust-engine-ui.py
      - name: Commit UI update
        run: |
          git config user.name "ASX Edge Bot"
          git config user.email "asx-edge@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Add persistent scorecard and trust engine"
          git push
