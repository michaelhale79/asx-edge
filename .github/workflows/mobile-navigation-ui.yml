name: ASX Edge Compact Mobile Navigation

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/patch-mobile-navigation.py'
      - '.github/workflows/mobile-navigation-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply compact mobile navigation
        run: python scripts/patch-mobile-navigation.py
      - name: Verify compact UI
        run: |
          python - <<'PY'
          s=open('index.html').read()
          for x in ['Best Buy','detailIconTabs','Overview','Analysis','Evidence','Scores','scoreInfoModal','function refreshBestBuyCompact()','function showScoreInfo','openMineHoldings']:
              assert x in s, x
          print('compact mobile UI verified')
          PY
      - name: Commit app update
        run: |
          git config user.name "ASX Edge Bot"
          git config user.email "asx-edge@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Make ASX Edge stock details easier to navigate"
          git pull --rebase origin main
          git push
