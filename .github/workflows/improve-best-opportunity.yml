name: ASX Edge Best Opportunity UI

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/improve-best-opportunity.py'
      - '.github/workflows/improve-best-opportunity.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Improve Best Opportunity and decision analysis
        run: python scripts/improve-best-opportunity.py
      - name: Verify patch
        run: |
          grep -q 'Best Opportunity' index.html
          grep -q 'function bestOpportunity' index.html
          grep -q 'function decisionReason' index.html
          grep -q 'Why I would avoid / reduce' index.html
      - name: Commit UI update
        run: |
          git config user.name "ASX Edge Bot"
          git config user.email "asx-edge@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Improve Best Opportunity and stock decisions"
          git pull --rebase origin main
          git push
