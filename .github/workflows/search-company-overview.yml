name: ASX Edge Company Overview Search UI

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/patch-search-company-overview.py'
      - '.github/workflows/search-company-overview.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch company overview and search
        run: python scripts/patch-search-company-overview.py
      - name: Commit UI update
        run: |
          git config user.name "ASX Edge Bot"
          git config user.email "asx-edge@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Add company overview and ASX search"
          git pull --rebase origin main
          git push
