name: ASX Edge Company Evidence

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/evidence_research.py'
      - '.github/workflows/company-evidence.yml'

permissions:
  contents: write

concurrency:
  group: asx-edge-data
  cancel-in-progress: false

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install PDF reader
        run: python -m pip install --disable-pip-version-check pypdf
      - name: Read company disclosures and build evidence layer
        run: python scripts/evidence_research.py
      - name: Commit company evidence
        run: |
          git config user.name "ASX Edge Bot"
          git config user.email "asx-edge@users.noreply.github.com"
          git add data.json study/company-evidence.json
          git diff --cached --quiet || git commit -m "Update ASX company evidence"
          git pull --rebase origin main
          git push
