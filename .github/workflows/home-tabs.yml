name: ASX Edge Home Tabs

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/patch-home-opportunity-tabs.py'
      - '.github/workflows/home-tabs.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply home tabs
        run: python scripts/patch-home-opportunity-tabs.py
      - name: Verify tabs
        run: |
          python - <<'PY'
          s=open('index.html').read()
          for x in ['data-home-tab="top10"','data-home-tab="tracking"','data-home-pane="top10"','data-home-pane="tracking"','function setHomeTab(key)','Recommendation tracking']:
              assert x in s, x
          print('Home tabs verified')
          PY
      - name: Commit app update
        run: |
          git config user.name "ASX Edge Bot"
          git config user.email "asx-edge@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Move Top 10 and tracking into tabs"
          git pull --rebase origin main
          git push
